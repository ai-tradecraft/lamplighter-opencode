# ---------------------------------------------------------------------------
# GitHub Actions CI — THIN WRAPPER
# ---------------------------------------------------------------------------
# This workflow deliberately contains no build logic. It only:
#   1. checks out the code,
#   2. installs uv (the single machine-level prerequisite),
#   3. installs the remaining dependencies via uv (`make install-deps`),
#   4. runs `make ci`.
#
# Everything else is uv-managed and isolated: the project's Python (3.12+), the
# hooks' Python 3.10, pre-commit, and just are all provisioned by uv inside
# `make install-deps` — nothing is installed into the system environment. To
# change WHAT runs in CI, edit the Makefile / justfile / .pre-commit-config.yaml
# — not this file.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv is the only prerequisite; it provisions everything else (Python
      # interpreters, pre-commit, just, project deps) in its managed cache.
      - uses: astral-sh/setup-uv@v5

      # Install all uv-managed dependencies, then run the single entrypoint.
      - run: make install-deps
      - run: make ci
